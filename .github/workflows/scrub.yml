name: Weekly news scrub

on:
  schedule:
    - cron: "0 11 * * 1" # Mondays 11:00 UTC
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra arguments, e.g. --company "Twelve" --days 30 --dry-run'
        required: false
        default: ""

concurrency:
  group: scrub
  cancel-in-progress: false

jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/industrialization-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Reuse extractions across runs so re-seen articles aren't paid for twice.
      - uses: actions/cache@v4
        with:
          path: apps/industrialization-monitor/reports/extract-cache
          key: extract-cache-${{ github.run_id }}
          restore-keys: extract-cache-

      - name: Scrub
        run: pnpm scrub $SCRUB_ARGS
        env:
          SCRUB_ARGS: ${{ inputs.args }} # passed via env, never interpolated into the script
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional email digest (Resend)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrub-report
          path: apps/industrialization-monitor/reports/scrub-*.md
          if-no-files-found: ignore
